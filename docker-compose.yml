services:
  vs-cap:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vs-cap
    ports:
      - "9005:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /run
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
          pids: 512
